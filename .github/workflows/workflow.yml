name: Java CI with Maven

on:
  push:
    branches: [ "francesco" ]
  pull_request:
    branches: [ "francesco" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean -PskipTests,all

      - name: Generate, Test, Coverage, and Mutate
        run: >
          mvn test jacoco:report org.pitest:pitest-maven:mutationCoverage 
          -Pjacoco,pit,randoop 
          -pl :syncope-core-spring,:syncope-common-idrepo-rest-api

      - name: Upload JaCoCo and PIT reports
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: test-reports
          path: |
            common/idrepo/rest-api/target/site/jacoco
            common/idrepo/rest-api/target/pit-reports
            core/spring/target/site/jacoco
            core/spring/target/pit-reports

      - name: Upload Auto-generated Tests
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: auto-generated-tests
          path: |
            common/idrepo/rest-api/target/generated-test-sources/randoop
            core/spring/target/generated-test-sources/randoop
