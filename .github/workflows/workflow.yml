name: Java CI with Maven

on:
  push:
    branches: [ "francesco" ]
  pull_request:
    branches: [ "francesco" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -PskipTests,syncope-core-spring,syncope-common-idrepo-rest-api -am

      - name: Generate, Test, Coverage, and Mutate
        run: >
          mvn test jacoco:report org.pitest:pitest-maven:mutationCoverage 
          -Pjacoco,pit,randoop 
          -pl bookkeeper-server